<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Мини-город</title>
<style>
:root{--bg:#a8cdee;--ink:#14212b;--panel:rgba(255,255,255,.86);--accent:#ff7a45}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.hud{position:absolute;left:12px;top:12px;max-width:min(330px,calc(100% - 150px));padding:10px 12px;border-radius:10px;background:var(--panel);color:var(--ink);pointer-events:none}
.hud b{display:block;font-size:15px;margin-bottom:2px}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:#14212b;color:#fff;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;pointer-events:none}
#cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross::before{left:8px;top:0;width:2px;height:18px}
#cross::after{top:8px;left:0;height:2px;width:18px}
#cross.hit::before,#cross.hit::after{background:#ff4040}
#invbtn{position:absolute;right:12px;top:12px;border:0;border-radius:10px;padding:10px 14px;background:var(--panel);color:var(--ink);font:600 14px system-ui,sans-serif}
#inv{position:absolute;right:12px;top:58px;width:min(300px,calc(100% - 24px));padding:12px;border-radius:12px;background:var(--panel);color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.invhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.invhead button,#equipbtn{border:0;border-radius:8px;padding:7px 12px;background:var(--ink);color:#fff;font:600 13px system-ui,sans-serif}
#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}
.cell{aspect-ratio:1;border-radius:8px;background:rgba(20,33,43,.12);border:2px solid transparent;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.cell.has{background:rgba(20,33,43,.85);color:#fff;border-color:rgba(255,255,255,.4)}
.cell.on{border-color:var(--accent)}
#iteminfo{margin-bottom:10px}
#iteminfo b{display:block}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px}
#hotbar{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px}
.slot{position:relative;width:46px;height:46px;border-radius:8px;background:rgba(20,33,43,.55);border:2px solid rgba(255,255,255,.6);color:#fff;display:flex;align-items:center;justify-content:center;touch-action:none}
.slot.sel{border-color:var(--accent);background:rgba(20,33,43,.85)}
.slot i{position:absolute;left:4px;top:1px;font:600 10px system-ui,sans-serif;font-style:normal;opacity:.85}
#ammo{position:absolute;left:50%;bottom:max(70px,calc(env(safe-area-inset-bottom,0px) + 70px));transform:translateX(-50%);padding:4px 10px;border-radius:999px;background:rgba(20,33,43,.75);color:#fff;font:600 13px system-ui,sans-serif;pointer-events:none;white-space:nowrap}
#stick{position:absolute;left:18px;bottom:max(22px,env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.7);touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(20,33,43,.75)}
.btn{position:absolute;right:18px;border:0;border-radius:50%;width:84px;height:84px;font:700 14px system-ui,sans-serif;color:#14212b;background:var(--accent);touch-action:none}
#jump{bottom:max(40px,calc(env(safe-area-inset-bottom,0px) + 18px))}
#run{bottom:max(138px,calc(env(safe-area-inset-bottom,0px) + 116px));width:64px;height:64px;right:28px;background:#fff;opacity:.9}
#run.on{background:#14212b;color:#fff}
#fire{right:112px;bottom:max(44px,calc(env(safe-area-inset-bottom,0px) + 22px));width:72px;height:72px;background:#e8453c;color:#fff}
#reload{right:124px;bottom:max(126px,calc(env(safe-area-inset-bottom,0px) + 104px));width:50px;height:50px;background:#fff;font-size:12px}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg);color:var(--ink)}
#stick,.btn{display:none}
.touch #stick,.touch .btn{display:block}
.touch #hotbar{bottom:max(150px,calc(env(safe-area-inset-bottom,0px) + 140px))}
.touch #ammo{bottom:max(204px,calc(env(safe-area-inset-bottom,0px) + 194px))}
#hpbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:140px;height:10px;border-radius:6px;background:rgba(20,33,43,.55);overflow:hidden;pointer-events:none}
#hpfill{height:100%;width:100%;background:#4fd36b;transition:width .35s ease}
#wanted{position:absolute;left:50%;top:26px;transform:translateX(-50%);padding:2px 10px;border-radius:999px;background:#2457c5;color:#fff;font:600 12px system-ui,sans-serif;pointer-events:none;white-space:nowrap}
#hurt{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s ease;background:radial-gradient(ellipse at center,rgba(200,0,0,0) 45%,rgba(200,0,0,.75) 100%)}
#dead{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;font:700 22px system-ui,sans-serif;text-align:center;padding:20px;pointer-events:none;animation:fi .6s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
#fsbtn{position:absolute;right:122px;top:12px;border:0;border-radius:10px;padding:10px 12px;background:var(--panel);color:var(--ink);font:600 14px system-ui,sans-serif}
#rotate{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#14212b;color:#fff;text-align:center;padding:24px}
#rotate button{border:0;border-radius:10px;padding:11px 18px;font:600 15px system-ui,sans-serif;background:#ff7a45;color:#14212b}
#rotate #rotgo{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.ph{width:44px;height:78px;border:4px solid #fff;border-radius:10px;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#toast{z-index:30}
#money{position:absolute;right:172px;top:12px;padding:10px 12px;border-radius:10px;background:var(--panel);color:#1c7a3a;font:700 15px system-ui,sans-serif;pointer-events:none}
#shopbtn{position:absolute;left:50%;top:60%;transform:translateX(-50%);z-index:10;border:0;border-radius:12px;padding:13px 20px;background:var(--accent);color:#14212b;font:700 15px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#shop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;width:min(480px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;padding:12px;border-radius:14px;background:rgba(255,255,255,.96);color:var(--ink);box-shadow:0 10px 36px rgba(0,0,0,.4)}
.shophead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.shophead b{flex:1;font-size:16px}
#shopmoney{font:700 15px system-ui,sans-serif;color:#1c7a3a}
#shopclose{border:0;border-radius:8px;padding:8px 12px;background:var(--ink);color:#fff;font:600 13px system-ui,sans-serif}
#shopmsg{min-height:18px;margin-bottom:6px;font-size:13px;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;border:0;border-radius:8px;padding:10px;background:rgba(20,33,43,.12);color:var(--ink);font:600 14px system-ui,sans-serif}
.tab.on{background:var(--ink);color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(20,33,43,.07);margin-bottom:6px}
.ri{width:44px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink)}
.rt{flex:1;min-width:0}
.rt b{display:block}
.rt span{display:block;font-size:12px;opacity:.75}
.pb{flex:none;border:0;border-radius:8px;padding:11px 12px;min-width:84px;background:var(--accent);color:#14212b;font:700 14px system-ui,sans-serif}
.pb[disabled]{background:rgba(20,33,43,.2);color:rgba(20,33,43,.6)}
.pb.poor{opacity:.55}
@media (orientation:landscape) and (max-height:560px){
.hud{left:max(10px,env(safe-area-inset-left));top:8px;padding:6px 9px;font-size:11px;max-width:min(250px,32%)}
.hud b{font-size:13px;margin-bottom:0}
#invbtn{top:8px;right:max(10px,env(safe-area-inset-right));padding:8px 12px}
#fsbtn{top:8px;right:calc(max(10px,env(safe-area-inset-right)) + 100px);padding:8px 10px}
#inv{top:48px;right:max(10px,env(safe-area-inset-right));width:min(400px,62%);max-height:calc(100% - 58px);overflow:auto;padding:10px}
#grid{grid-template-columns:repeat(6,minmax(0,1fr))}
#stick{left:max(20px,env(safe-area-inset-left));bottom:14px;width:104px;height:104px}
#knob{left:28px;top:28px}
.btn{right:max(18px,env(safe-area-inset-right))}
#jump{bottom:14px;width:76px;height:76px}
#fire{right:calc(max(18px,env(safe-area-inset-right)) + 88px);bottom:26px;width:68px;height:68px}
#run{right:calc(max(18px,env(safe-area-inset-right)) + 12px);bottom:104px;width:56px;height:56px}
#reload{right:calc(max(18px,env(safe-area-inset-right)) + 100px);bottom:104px;width:46px;height:46px}
.touch #hotbar{bottom:12px}
.touch #ammo{bottom:64px}
.slot{width:42px;height:42px}
#toast{top:48px}
#money{top:8px;right:calc(max(10px,env(safe-area-inset-right)) + 150px);padding:8px 10px}
#shopbtn{top:64%}
}
</style>
<div id="app">
  <canvas id="c" aria-label="Город"></canvas>
  <div class="hud"><b>Мини-город</b><span id="hint"></span></div>
  <div id="toast" role="status"></div>
  <div id="hpbar"><div id="hpfill"></div></div>
  <div id="wanted" hidden></div>
  <div id="hurt"></div>
  <div id="dead" hidden>Тебя застрелила полиция</div>
  <button id="fsbtn" type="button">⛶</button>
  <div id="rotate"><div class="ph"></div><b>Поверни телефон горизонтально</b><button id="rotfull" type="button">На весь экран</button><button id="rotgo" type="button">Играть так</button></div>
  <div id="cross" hidden></div>
  <div id="money">$100</div>
  <button id="shopbtn" type="button" hidden>Открыть магазин</button>
  <div id="shop" hidden>
    <div class="shophead"><b id="shoptitle"></b><span id="shopmoney"></span><button id="shopclose" type="button">Закрыть</button></div>
    <div id="shopmsg"></div>
    <div class="tabs" id="shoptabs"></div>
    <div id="shoplist"></div>
  </div>
  <button id="invbtn" type="button">Инвентарь</button>
  <div id="inv" hidden>
    <div class="invhead"><b>Инвентарь</b><button id="invclose" type="button">Закрыть</button></div>
    <div id="grid"></div>
    <div id="iteminfo"></div>
    <button id="equipbtn" type="button">Взять в руки</button>
    <label class="chk"><input type="checkbox" id="bloodchk" checked> Показывать кровь</label>
  </div>
  <div id="ammo" hidden></div>
  <div id="hotbar"></div>
  <div id="stick"><div id="knob"></div></div>
  <button class="btn" id="run" type="button">Бег</button>
  <button class="btn" id="jump" type="button">Прыжок</button>
  <button class="btn" id="fire" type="button" hidden>Огонь</button>
  <button class="btn" id="reload" type="button" hidden>R</button>
  <div id="msg" hidden>Не удалось загрузить 3D-движок. Обнови страницу.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
window.addEventListener('error',function(e){
  var m=document.getElementById('msg');
  m.textContent='Ошибка: '+(e&&e.message?e.message:'неизвестная');m.hidden=false;
});
if(!window.THREE){document.getElementById('msg').hidden=false;return;}

/* ---------- constants ---------- */
var P=80, R=16, N=5, LANE=R/4, CITY=N*P, WALK=R/2+2;
var DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
var seed=11;
function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function rr(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function angDiff(a,b){var d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;}

var SW=18,SD=14;
var SHOPD=[
 {i:1,j:2,lx:1,lz:0,type:'gun',name:'ОРУЖЕЙНАЯ ЛАВКА',sub:'Оружие • Патроны',title:'Оружейная лавка'},
 {i:3,j:2,lx:0,lz:1,type:'gun',name:'АРСЕНАЛ',sub:'Стволы и патроны',title:'Арсенал'},
 {i:2,j:1,lx:0,lz:1,type:'gun',name:'ОРУЖИЕ И ПАТРОНЫ',sub:'Работаем без выходных',title:'Оружие и патроны'},
 {i:2,j:3,lx:1,lz:0,type:'food',name:'ПРОДУКТЫ',sub:'Чипсы • Газировка',title:'Продукты'},
 {i:1,j:1,lx:1,lz:1,type:'food',name:'МИНИМАРКЕТ',sub:'Всё для перекуса',title:'Минимаркет'},
 {i:3,j:3,lx:0,lz:0,type:'food',name:'У ДОМА',sub:'Чипсы, соки, снеки',title:'Магазин «У дома»'}
];
function shopAt(i,j,lx,lz){for(var q=0;q<SHOPD.length;q++){var d=SHOPD[q];if(d.i===i&&d.j===j&&d.lx===lx&&d.lz===lz)return d;}return null;}
function shopGeo(d){
  var cx=d.i*P+(d.lx?54.5:25.5),dirz=d.lz===0?1:-1;
  var zf=d.lz===0?d.j*P+R/2+3.5:(d.j+1)*P-R/2-3.5,zb=zf+dirz*SD;
  return {cx:cx,zf:zf,zb:zb,dirz:dirz,x0:cx-SW/2,x1:cx+SW/2,z0:Math.min(zf,zb),z1:Math.max(zf,zb)};
}
var touch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
if(touch)app.classList.add('touch');
document.getElementById('hint').textContent=touch
  ?'Левый круг: идти. Тяни экран: камера. Тап: выстрел. Зайди в магазин и подойди к продавцу.'
  :'WASD: идти. Пробел: прыжок. Shift: бег. 1-5: оружие. ЛКМ или F: выстрел. R: перезарядка. I: инвентарь. G: магазин. За убийство NPC +$20.';

/* ---------- renderer ---------- */
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,touch?1.5:2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene();
var SKY=0xa8cdee;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,110,380);
var camera=new THREE.PerspectiveCamera(62,1,0.3,900);
function resize(){
  var w=app.clientWidth,h=app.clientHeight;
  if(!w||!h)return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
resize();

scene.add(new THREE.HemisphereLight(0xd6e8ff,0x8a8f78,0.75));
var sun=new THREE.DirectionalLight(0xfff0d4,0.95);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
var sc=sun.shadow.camera;sc.left=-48;sc.right=48;sc.top=48;sc.bottom=-48;sc.near=10;sc.far=260;
sun.shadow.bias=-0.0006;
scene.add(sun);scene.add(sun.target);

var MAXANI=Math.min(4,renderer.capabilities.getMaxAnisotropy());

/* ---------- textures ---------- */
function speckleCanvas(base,count,alpha){
  var c=document.createElement('canvas');c.width=c.height=128;
  var g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,128,128);
  for(var i=0;i<count;i++){
    var v=rnd()>0.5?255:0;
    g.fillStyle='rgba('+v+','+v+','+v+','+alpha+')';
    g.fillRect(Math.floor(rnd()*128),Math.floor(rnd()*128),1+Math.floor(rnd()*2),1+Math.floor(rnd()*2));
  }
  return c;
}
function repTex(canvas,rx,ry){
  var t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rx,ry);
  t.anisotropy=MAXANI;
  return t;
}
var asphaltC=speckleCanvas('#34373a',2400,0.09);
var paveC=(function(){
  var c=speckleCanvas('#b9b6ae',900,0.06);
  var g=c.getContext('2d');g.strokeStyle='rgba(60,60,55,.35)';g.lineWidth=2;
  g.strokeRect(1,1,126,126);g.beginPath();g.moveTo(64,0);g.lineTo(64,128);g.moveTo(0,64);g.lineTo(128,64);g.stroke();
  return c;
})();

/* ---------- ground, roads, sidewalks ---------- */
var ground=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.MeshLambertMaterial({color:0x789a62}));
ground.rotation.x=-Math.PI/2;ground.position.set(CITY/2,-0.02,CITY/2);ground.receiveShadow=true;scene.add(ground);

var roadLen=CITY+R;
var j,i;
for(j=0;j<=N;j++){
  var rx=new THREE.Mesh(new THREE.BoxGeometry(roadLen,0.04,R),new THREE.MeshLambertMaterial({map:repTex(asphaltC,roadLen/10,R/10)}));
  rx.position.set(CITY/2,0.02,j*P);rx.receiveShadow=true;scene.add(rx);
  var rz=new THREE.Mesh(new THREE.BoxGeometry(R,0.05,roadLen),new THREE.MeshLambertMaterial({map:repTex(asphaltC,R/10,roadLen/10)}));
  rz.position.set(j*P,0.025,CITY/2);rz.receiveShadow=true;scene.add(rz);
}
var PARK={i:2,j:2};
function isPark(bi,bj){return bi===PARK.i&&bj===PARK.j;}
var slabSize=P-R;
for(i=0;i<N;i++)for(j=0;j<N;j++){
  var park=isPark(i,j);
  var mat=park?new THREE.MeshLambertMaterial({color:0x6a9a52}):new THREE.MeshLambertMaterial({map:repTex(paveC,slabSize/4,slabSize/4)});
  var slab=new THREE.Mesh(new THREE.BoxGeometry(slabSize,0.2,slabSize),mat);
  slab.position.set(i*P+P/2,0.1,j*P+P/2);slab.receiveShadow=true;scene.add(slab);
}

/* lane dashes and crosswalks (instanced) */
var dummy=new THREE.Object3D();
function setInst(m,k,x,y,z,sx,sy,sz){dummy.position.set(x,y,z);dummy.scale.set(sx,sy,sz);dummy.rotation.set(0,0,0);dummy.updateMatrix();m.setMatrixAt(k,dummy.matrix);}
function instFrom(list,geo,mat,y){
  var m=new THREE.InstancedMesh(geo,mat,Math.max(1,list.length));
  for(var k=0;k<list.length;k++){var d=list[k];setInst(m,k,d[0],y,d[1],d[2],1,d[3]);}
  m.count=list.length;m.instanceMatrix.needsUpdate=true;m.receiveShadow=true;scene.add(m);return m;
}
var unit=new THREE.BoxGeometry(1,0.02,1);
var dashes=[];
for(j=0;j<=N;j++)for(i=0;i<N;i++){
  var s0=i*P+R/2+4,s1=(i+1)*P-R/2-4;
  for(var q=s0+2;q<s1;q+=8){
    dashes.push([q,j*P,4,0.3]);
    dashes.push([j*P,q,0.3,4]);
  }
}
instFrom(dashes,unit,new THREE.MeshLambertMaterial({color:0xe3c14a}),0.07);
var stripes=[];
for(i=0;i<=N;i++)for(j=0;j<=N;j++){
  for(var a=0;a<4;a++){
    var d=DIRS[a];
    if(i+d[0]<0||i+d[0]>N||j+d[1]<0||j+d[1]>N)continue;
    var cx=i*P+d[0]*(R/2+1.5),cz=j*P+d[1]*(R/2+1.5);
    for(var p=-R/2+1.2;p<=R/2-1.1;p+=1.8){
      if(d[0]!==0)stripes.push([cx,cz+p,3,0.9]);else stripes.push([cx+p,cz,0.9,3]);
    }
  }
}

/* ---------- buildings ---------- */

function groundH(x,z){
  if(x<-R/2||z<-R/2||x>CITY+R/2||z>CITY+R/2)return 0;
  var bi=Math.floor(x/P),bj=Math.floor(z/P);
  if(bi<0||bj<0||bi>=N||bj>=N)return 0.05;
  var lx=x-bi*P,lz=z-bj*P;
  if(lx>=R/2&&lx<=P-R/2&&lz>=R/2&&lz<=P-R/2)return 0.2;
  return 0.05;
}
function collide(p,r){
  for(var k=0;k<colliders.length;k++){
    var b=colliders[k];
    if(p.y>b.h)continue;
    if(p.x<b.minx-r-1||p.x>b.maxx+r+1||p.z<b.minz-r-1||p.z>b.maxz+r+1)continue;
    var cx=Math.max(b.minx,Math.min(p.x,b.maxx)),cz=Math.max(b.minz,Math.min(p.z,b.maxz));
    var dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){
      if(d2>1e-8){var d=Math.sqrt(d2);p.x=cx+dx/d*r;p.z=cz+dz/d*r;}
      else{
        var l=p.x-b.minx,rg=b.maxx-p.x,t=p.z-b.minz,bt=b.maxz-p.z,m=Math.min(l,rg,t,bt);
        if(m===l)p.x=b.minx-r;else if(m===rg)p.x=b.maxx+r;else if(m===t)p.z=b.minz-r;else p.z=b.maxz+r;
      }
    }
  }
}
function insideBuilding(x,y,z,m){
  for(var k=0;k<colliders.length;k++){
    var b=colliders[k];
    if(y<b.h&&x>b.minx-m&&x<b.maxx+m&&z>b.minz-m&&z<b.maxz+m)return true;
  }
  return false;
}

var obst=[];
function updateCar(c,dt){
  var want=c.vmax,hx,hz,lightStop=false;
  if(c.mode==='road'){
    hx=c.dx;hz=c.dz;
    var axis=c.dx!==0?0:1;
    var nx=c.ni*P,nz=c.nj*P;
    var dist=(nx-c.x)*c.dx+(nz-c.z)*c.dz;
    var stopD=R/2+4.2,nd=nodes[c.ni][c.nj];
    if(!c.reserved){
      var gap=dist-stopD;
      var ph=phase(axis,c.ni,c.nj,simTime);
      var brk=c.speed*c.speed/(2*8);
      var red=ph.state===0||(ph.state===1&&gap>brk*0.9);
      var blocked=nd.count>0&&nd.axis!==axis;
      if(gap>-0.5&&(red||blocked)){
        lightStop=true;
        want=Math.min(want,Math.sqrt(2*12*Math.max(0,gap)));
        if(gap<0.15)want=0;
      }else{
        c.reserved=true;nd.count++;nd.axis=axis;
      }
    }
    if(c.reserved&&dist<=R/2+0.02){
      var opts=[],wts=[];
      var lf=[c.dz,-c.dx],rt=[-c.dz,c.dx];
      [[c.dx,c.dz,0.6],[lf[0],lf[1],0.2],[rt[0],rt[1],0.2]].forEach(function(o){
        var ti=c.ni+o[0],tj=c.nj+o[1];
        if(ti>=0&&ti<=N&&tj>=0&&tj<=N){opts.push(o);wts.push(o[2]);}
      });
      var tot=wts.reduce(function(a,b){return a+b;},0),rv=Math.random()*tot,ch=opts[0];
      for(var k=0;k<opts.length;k++){rv-=wts[k];if(rv<=0){ch=opts[k];break;}}
      var rd=[-c.dz,c.dx],r2=[-ch[1],ch[0]];
      var E={x:nx+rd[0]*LANE-c.dx*R/2,z:nz+rd[1]*LANE-c.dz*R/2};
      var X={x:nx+r2[0]*LANE+ch[0]*R/2,z:nz+r2[1]*LANE+ch[1]*R/2};
      var straight=(ch[0]===c.dx&&ch[1]===c.dz),C;
      if(straight)C={x:(E.x+X.x)/2,z:(E.z+X.z)/2};
      else{var dp=(X.x-E.x)*c.dx+(X.z-E.z)*c.dz;C={x:E.x+c.dx*dp,z:E.z+c.dz*dp};}
      c.turn={E:E,C:C,X:X,t:0,len:Math.hypot(X.x-E.x,X.z-E.z)*(straight?1:1.2),nd:ch};
      c.mode='turn';c.x=E.x;c.z=E.z;
    }
  }
  if(c.mode==='turn'){
    var T=c.turn,t=T.t;
    var ddx=2*(1-t)*(T.C.x-T.E.x)+2*t*(T.X.x-T.C.x),ddz=2*(1-t)*(T.C.z-T.E.z)+2*t*(T.X.z-T.C.z);
    var l=Math.hypot(ddx,ddz)||1;hx=ddx/l;hz=ddz/l;
    want=Math.min(want,(T.nd[0]===c.dx&&T.nd[1]===c.dz)?c.vmax:5.5);
  }
  var k2,o,ox,oz,along,lat;
  for(k2=0;k2<obst.length;k2++){
    o=obst[k2];ox=o.x-c.x;oz=o.z-c.z;
    along=ox*hx+oz*hz;lat=Math.abs(ox*hz-oz*hx);
    if(along>0.4&&along<9&&lat<1.7){
      want=Math.min(want,Math.sqrt(2*10*Math.max(0,along-3.6)));
      if(along<3.8)want=0;
    }
  }
  if(c.ghost>0)c.ghost-=dt;
  else{
    for(k2=0;k2<cars.length;k2++){
      var o2=cars[k2];if(o2===c)continue;
      ox=o2.x-c.x;oz=o2.z-c.z;
      along=ox*hx+oz*hz;lat=Math.abs(ox*hz-oz*hx);
      if(along>0&&along<11&&lat<1.9){
        var gp=along-4.6;
        want=Math.min(want,Math.sqrt(2*10*Math.max(0,gp-0.8)));
        if(gp<0.9)want=0;
      }
    }
  }
  if(c.speed>want)c.speed=Math.max(want,c.speed-14*dt);

  }else{
    var T2=c.turn;
    T2.t=Math.min(1,T2.t+c.speed*dt/T2.len);

    c.z=u*u*T2.E.z+2*u*tt*T2.C.z+tt*tt*T2.X.z;
    if(T2.t>=1){
      c.dx=T2.nd[0];c.dz=T2.nd[1];
      nodes[c.ni][c.nj].count=Math.max(0,nodes[c.ni][c.nj].count-1);
      c.ni+=c.dx;c.nj+=c.dz;c.reserved=false;c.mode='road';c.turn=null;
    }

  c.model.position.set(c.x,0.05,c.z);
  c.model.rotation.y=Math.atan2(-hz,hx);

}

function updateNpc(n,dt){
  var e=n.edge;

    n.bleed-=dt;n.hp-=4*dt;n.bleedDrop-=dt;

    if(n.hp<=0){die(n);return;}
  }
  if(n.fear>0)n.fear-=dt;
  var waiting=false;
  if(e.type==='cross'&&n.prog<=0.001&&n.fear<=0&&!canCross(e))waiting=true;
  var base=n.speed;
  if(n.fear>0)base=3.4;

  if(!waiting){

      var o=npcs[k];if(o===n)continue;

  if(n.v>0.15){var ty=Math.atan2(dx,dz);n.yaw+=angDiff(n.yaw,ty)*Math.min(1,12*dt);}
  n.phase+=n.v*dt*3.9;

}

function raySphere(o,d,cx,cy,cz,r){
  var ox=o.x-cx,oy=o.y-cy,oz=o.z-cz;
  var b=ox*d.x+oy*d.y+oz*d.z,c=ox*ox+oy*oy+oz*oz-r*r,disc=b*b-c;
  if(disc<0)return -1;
  var sq=Math.sqrt(disc),t=-b-sq;
  if(t>0)return t;
  return (-b+sq>0)?0.01:-1;
}
function rayBox(o,d,x0,x1,y0,y1,z0,z1){
  var tmin=0,tmax=1e9;
  var arr=[[o.x,d.x,x0,x1],[o.y,d.y,y0,y1],[o.z,d.z,z0,z1]];
  for(var k=0;k<3;k++){
    var oo=arr[k][0],dd=arr[k][1],lo=arr[k][2],hi=arr[k][3];
    if(Math.abs(dd)<1e-9){if(oo<lo||oo>hi)return -1;}
    else{
      var t1=(lo-oo)/dd,t2=(hi-oo)/dd;
      if(t1>t2){var tmp=t1;t1=t2;t2=tmp;}
      tmin=Math.max(tmin,t1);tmax=Math.min(tmax,t2);
      if(tmin>tmax)return -1;
    }
  }
  return tmin;
}

function shootRay(o,d,W,first){

    var n=npcs[k],gy=groundH(n.x,n.z);

    t=raySphere(o,d,n.x,gy+1.25,n.z,0.36);if(t>0&&t<best){best=t;kind='npc';hn=n;hz2='torso';}

  }
  for(k=0;k<cars.length;k++){

}

  if(L1<1||L2<1){seg(S,T);pts.push({x:T.x,z:T.z});return pts;}
  var rad=Math.min(r,L1/2,L2/2);
  var a={x:C.x-d1x/L1*rad,z:C.z-d1z/L1*rad},b={x:C.x+d2x/L2*rad,z:C.z+d2z/L2*rad};

function roadPath(){
  var all=[],ci,cj;
  for(ci=0;ci<=N;ci++)for(cj=0;cj<=N;cj++)all.push([Math.hypot(ci*P-player.x,cj*P-player.z),ci,cj]);
  var far=all.filter(function(a){return a[0]>110&&a[0]<230;});
  if(!far.length)far=all.sort(function(a,b){return b[0]-a[0];}).slice(0,4);
  var s=pick(far),si=s[1],sj=s[2],ti=clamp(Math.round(player.x/P),0,N),tj=clamp(Math.round(player.z/P),0,N);
  var S={x:si*P,z:sj*P},C,T;

  else{T={x:clamp(player.x,0,CITY),z:tj*P};C={x:si*P,z:tj*P};}

function updatePCar(c,dt){

    }
    var px=player.x-c.x,pz=player.z-c.z,al=px*c.hx+pz*c.hz,lt=px*c.hz-pz*c.hx;
    if(c.speed>1&&Math.abs(al)<2.6&&Math.abs(lt)<1.3&&player.y<1.4&&!dead){
      var sd=lt>=0?1:-1;player.vx+=c.hz*sd*5+c.hx*c.speed*0.5;player.vz+=-c.hx*sd*5+c.hz*c.speed*0.5;
      if(player.grounded){player.vy=4;player.grounded=false;}
    }
  }
  var on=Math.sin(simTime*14)>0;
  u.mr.color.setHex(on?0xff2a2a:0x3a0808);u.mb.color.setHex(on?0x0a1a3a:0x2a6bff);
  c.model.position.set(c.x,0.05,c.z);c.model.rotation.y=Math.atan2(-c.hz,c.hx);
}
function respawnPlayer(){
  dead=false;hp=100;heat=0;pending=0;elHp.style.width='100%';elDead.hidden=true;
  player.x=2*P+WALK;player.z=2*P+WALK;player.y=0.2;player.dy=0.2;player.vx=player.vz=player.vy=0;player.grounded=true;player.model.rotation.x=0;
  pcars.forEach(function(c){c.cops.forEach(function(o){scene.remove(o.model,o.tr,o.fl);});c.cops=[];});
  toast('Ты снова в игре');
}
function updatePolice(dt){
  if(heat>0&&!dead)heat-=dt;
  if(pending>0){pending-=dt;if(pending<=0&&heat>0&&!dead)dispatch();}
  elWanted.hidden=!(heat>0);if(heat>0)elWanted.textContent='Розыск: '+Math.ceil(heat)+' с';
  hurtT=Math.max(0,hurtT-dt);
  elHurt.style.opacity=Math.max(Math.min(1,hurtT*2),(hp<35&&!dead)?0.3:0);
  if(dead){deadT+=dt;if(deadT>4)respawnPlayer();}
  for(var k=pcars.length-1;k>=0;k--){
    var c=pcars[k];
    if(heat<=0)c.lt+=dt;
    updatePCar(c,dt);
    for(var q=c.cops.length-1;q>=0;q--){
      if(updateCop(c.cops[q],c,dt)){var o=c.cops[q];scene.remove(o.model,o.tr,o.fl);c.cops.splice(q,1);}
    }
    if(c.state==='parked'&&heat<=0&&!c.cops.length){c.state='away';c.pts.reverse();recum(c);c.s=0;c.i=0;c.speed=0;}
    if(c.state==='gone'){scene.remove(c.model);pcars.splice(k,1);}
  }
}
/* ---------- landscape / fullscreen ---------- */
var elRot=document.getElementById('rotate'),rotOff=false;
function chkRot(){elRot.style.display=(touch&&!rotOff&&window.innerHeight>window.innerWidth)?'flex':'none';}
window.addEventListener('resize',chkRot);window.addEventListener('orientationchange',chkRot);chkRot();
function goFull(){
  var de=document.documentElement,f=de.requestFullscreen||de.webkitRequestFullscreen;
  try{Promise.resolve(f&&f.call(de)).then(function(){return screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');}).catch(function(){});}catch(e){}
}
document.getElementById('rotfull').addEventListener('click',goFull);
document.getElementById('fsbtn').addEventListener('click',goFull);
document.getElementById('rotgo').addEventListener('click',function(){rotOff=true;chkRot();});

/* ---------- input ---------- */
var kb={},jumpQ=false,runBtn=false,stickX=0,stickY=0;
window.addEventListener('keydown',function(e){
  if(e.repeat&&e.code!=='KeyF'){if(e.code==='Space'||e.code==='Tab')e.preventDefault();return;}
  kb[e.code]=true;
  if(e.code==='Space'){jumpQ=true;e.preventDefault();}
  if(e.code.indexOf('Arrow')===0)e.preventDefault();
  if(e.code.indexOf('Digit')===0){var wk=+e.code.charAt(5)-1;if(wk>=0&&wk<5)equipWeapon(wk);}
  if(e.code==='KeyG'){if(shopOpen)closeShop();else openNear();}
  if(e.code==='KeyR')startReload();
  if(e.code==='KeyF')tryFire();
  if(e.code==='KeyI'||e.code==='Tab'){toggleInv();e.preventDefault();}
  if(e.code==='Escape'){toggleInv(false);closeShop();}
});
window.addEventListener('keyup',function(e){kb[e.code]=false;});
window.addEventListener('blur',function(){kb={};});
var drag=null;
canvas.addEventListener('pointerdown',function(e){
  if(drag)return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:0,t:performance.now()};
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
});
canvas.addEventListener('pointermove',function(e){
  if(!drag||drag.id!==e.pointerId)return;
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  drag.moved+=Math.abs(dx)+Math.abs(dy);
  camYaw-=dx*0.0055;
  camPitch=clamp(camPitch+dy*0.0042,0.08,1.25);
  drag.x=e.clientX;drag.y=e.clientY;
  if(drag.moved>6)lastDrag=simTime;
});
function endDrag(e){
  if(!drag||drag.id!==e.pointerId)return;
  if(e.type==='pointerup'&&drag.moved<8&&performance.now()-drag.t<320)tryFire();
  drag=null;
}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('wheel',function(e){camDist=clamp(camDist+e.deltaY*0.01,4,15);e.preventDefault();},{passive:false});

var stick=document.getElementById('stick'),knob=document.getElementById('knob'),sid=null;
function stickMove(e){
  var r=stick.getBoundingClientRect();
  var dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  var m=Math.hypot(dx,dy),lim=44;
  if(m>lim){dx=dx/m*lim;dy=dy/m*lim;}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
  stickX=dx/lim;stickY=-dy/lim;
}
function stickEnd(e){
  if(sid!==e.pointerId)return;
  sid=null;stickX=stickY=0;knob.style.transform='translate(0,0)';
}
stick.addEventListener('pointerdown',function(e){sid=e.pointerId;try{stick.setPointerCapture(e.pointerId);}catch(err){}stickMove(e);e.preventDefault();});
stick.addEventListener('pointermove',function(e){if(sid===e.pointerId)stickMove(e);});
stick.addEventListener('pointerup',stickEnd);
stick.addEventListener('pointercancel',stickEnd);
document.getElementById('jump').addEventListener('pointerdown',function(e){jumpQ=true;e.preventDefault();});
elFire.addEventListener('pointerdown',function(e){holdFire=true;tryFire();e.preventDefault();});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){elFire.addEventListener(ev,function(){holdFire=false;});});
elReload.addEventListener('pointerdown',function(e){startReload();e.preventDefault();});
var runEl=document.getElementById('run');
runEl.addEventListener('pointerdown',function(e){runBtn=!runBtn;runEl.classList.toggle('on',runBtn);e.preventDefault();});

var toastEl=document.getElementById('toast'),toastT=0;
function toast(t){
  if(toastT>0)return;
  toastEl.textContent=t;toastEl.classList.add('on');toastT=1.4;
}

/* ---------- player update ---------- */
function updatePlayer(dt){
  var gs=gunState;
  if(dead){
    jumpQ=false;player.vx*=0.9;player.vz*=0.9;
    var fp=Math.min(1,deadT/0.6),ef=fp*fp*(3-2*fp),du=player.model.userData;
    player.model.rotation.x=ef*Math.PI/2;
    player.model.position.set(player.x,player.dy+0.14*ef,player.z);
    du.shL.rotation.z=-0.7*ef;du.shR.rotation.z=0.7*ef;
    return;
  }
  if(gs.cooldown>0)gs.cooldown-=dt;
  if(gs.reloadT>0){
    gs.reloadT-=dt;
    if(gs.reloadT<=0){
      var RW=WEAPONS[gs.w],RS=wst[gs.w],take=Math.min(RW.mag-RS.ammo,RS.reserve);RS.ammo+=take;RS.reserve-=take;gs.reloadT=0;updateAmmo();
    }
  }
  if(player.kick>0)player.kick=Math.max(0,player.kick-dt*6);
  if(player.aimT>0)player.aimT-=dt;
  if(kb.KeyQ){camYaw+=1.9*dt;lastDrag=simTime;}
  if(kb.KeyE){camYaw-=1.9*dt;lastDrag=simTime;}
  var frz=shopOpen?0:1;var ix=((kb.KeyD||kb.ArrowRight?1:0)-(kb.KeyA||kb.ArrowLeft?1:0)+stickX)*frz;
  var iy=((kb.KeyW||kb.ArrowUp?1:0)-(kb.KeyS||kb.ArrowDown?1:0)+stickY)*frz;
  var len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len;}
  var fx=Math.sin(camYaw),fz=Math.cos(camYaw),rx=-fz,rz=fx;
  var wx=fx*iy+rx*ix,wz=fz*iy+rz*ix;
  var wl=Math.hypot(wx,wz),mag=Math.min(1,wl);
  var run=kb.ShiftLeft||kb.ShiftRight||runBtn;
  var sp=(run?7.4:4.3)*mag;
  var tx=wl>0.001?wx/wl*sp:0,tz=wl>0.001?wz/wl*sp:0;
  var acc=(player.grounded?34:9)*dt;
  player.vx+=clamp(tx-player.vx,-acc,acc);
  player.vz+=clamp(tz-player.vz,-acc,acc);
  if(jumpQ&&player.grounded&&!shopOpen){player.vy=8;player.grounded=false;}
  jumpQ=false;
  if(!player.grounded)player.vy-=24*dt;
  player.x+=player.vx*dt;player.z+=player.vz*dt;player.y+=player.vy*dt;
  player.x=clamp(player.x,-40,CITY+40);player.z=clamp(player.z,-40,CITY+40);
  collide(player,0.45);
  var gh=groundH(player.x,player.z);
  if(player.y<=gh+0.001){player.y=gh;player.vy=0;player.grounded=true;}
  else if(player.grounded&&player.y-gh<0.35&&player.vy<=0){player.y=gh;}
  else player.grounded=false;
  var spd=Math.hypot(player.vx,player.vz);
  /* body turns toward walking direction automatically; aims where the camera looks with the pistol out */
  var aiming=gs.equipped;
  if(aiming){
    player.yaw+=angDiff(player.yaw,camYaw)*Math.min(1,18*dt);
  }else if(spd>0.4){
    player.yaw+=angDiff(player.yaw,Math.atan2(player.vx,player.vz))*Math.min(1,16*dt);
  }
  /* camera swings behind the character while walking forward (like Roblox) */
  if(!aiming&&spd>1.2&&iy>0.1&&simTime-lastDrag>1.0&&!drag){
    var heading=Math.atan2(player.vx,player.vz);
    camYaw+=angDiff(camYaw,heading)*Math.min(1,2.0*dt*Math.min(1,iy*1.2));
  }
  player.phase+=spd*dt*3.9;
  pose(player.model,player.phase,clamp(spd/4.3,0,1.45),!player.grounded,player.vy,{aim:aiming,kick:player.kick});
  player.dy+=(player.y-player.dy)*Math.min(1,22*dt);
  player.model.position.set(player.x,player.dy,player.z);
  player.model.rotation.y=player.yaw;
  for(var k=0;k<npcs.length;k++){
    var n=npcs[k],dx=player.x-n.x,dz=player.z-n.z,d=Math.hypot(dx,dz);
    if(d<0.7&&d>0.001){player.x+=dx/d*(0.7-d)*0.5;player.z+=dz/d*(0.7-d)*0.5;}
  }
}

/* ---------- camera ---------- */
function updateCamera(dt){
  var fx=Math.sin(camYaw),fz=Math.cos(camYaw);
  var wantSh=gunState.equipped?0.65:0;
  shoulder+=(wantSh-shoulder)*Math.min(1,8*dt);
  camTarget.set(player.x+(-fz)*shoulder,player.dy+1.55,player.z+fx*shoulder);
  var cp=Math.cos(camPitch),sp=Math.sin(camPitch);
  var dist=camDist;
  for(var s=dist;s>1.6;s-=0.5){
    var x=camTarget.x-fx*s*cp,y=camTarget.y+s*sp,z=camTarget.z-fz*s*cp;
    if(!insideBuilding(x,y,z,0.6)){dist=s;break;}
    dist=s-0.5;
  }
  dist=Math.max(1.6,dist);
  var cy=Math.max(0.6,camTarget.y+dist*sp);
  camera.position.set(camTarget.x-fx*dist*cp,cy,camTarget.z-fz*dist*cp);
  camera.lookAt(camTarget);
  sun.position.set(player.x+55,95,player.z+38);
  sun.target.position.set(player.x,0,player.z);
}

/* ---------- loop ---------- */
var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!(dt>0))dt=0.016;
  simTime+=dt;gdt=dt;
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('on');}
  if(crossTimer>0){crossTimer-=dt;if(crossTimer<=0)elCross.classList.remove('hit');}
  if(fxT>0){fxT-=dt;if(fxT<=0){tracer.visible=false;flash.visible=false;}}
  updateSignals();
  updatePlayer(dt);
  obst.length=0;
  obst.push({x:player.x,z:player.z});
  pcars.forEach(function(p){obst.push(p);});
  var k;
  for(k=0;k<npcs.length;k++)obst.push(npcs[k]);
  for(k=npcs.length-1;k>=0;k--)updateNpc(npcs[k],dt);
  for(k=0;k<cars.length;k++)updateCar(cars[k],dt);
  updateCorpses(dt);
  updateRespawn(dt);
  updateParticles(dt);
  updatePolice(dt);
  updateCamera(dt);
  updateShops(dt);autoFire();
  if(fireQ){fireQ=false;doShoot();}
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
</script>
